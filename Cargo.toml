[package]
name = "soyo-argb"
version = "0.1.0"
edition = "2024"
description = "Controle de iluminação ARGB da SOYO B550M (SONiX 0c45:7125) no Linux"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", optional = true }
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[features]
gui = ["dep:eframe"]

[[bin]]
name = "soyo-argb"
path = "src/main.rs"

[[bin]]
name = "soyo-argb-gui"
path = "src/bin/soyo-argb-gui.rs"
required-features = ["gui"]
